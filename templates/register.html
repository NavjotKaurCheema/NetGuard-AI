{% extends "base.html" %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <h2><i class="fa fa-user-plus"></i> Create Account</h2>
    {% if error %}<div class="alert-error">{{ error }}</div>{% endif %}
    <div class="form-group">
      <label><i class="fa fa-id-card"></i> Full Name</label>
      <input type="text" id="name" placeholder="John Doe"/>
    </div>
    <div class="form-group">
      <label><i class="fa fa-envelope"></i> Email</label>
      <input type="email" id="email" placeholder="example@mail.com"/>
    </div>
    <div class="form-group">
      <label><i class="fa fa-location-dot"></i> Address</label>
      <input type="text" id="address" placeholder="City, Country"/>
    </div>
    <div class="form-group">
      <label><i class="fa fa-phone"></i> Mobile Number</label>
      <input type="text" id="mobile" placeholder="+91 98765 43210"/>
    </div>
    <div class="form-group">
      <label><i class="fa fa-user"></i> Username</label>
      <input type="text" id="username" placeholder="choose_username"/>
    </div>
    <div class="form-group">
      <label><i class="fa fa-lock"></i> Password</label>
      <input type="password" id="password" placeholder="min 6 characters"/>
    </div>
    <button class="btn-primary full-w" onclick="doRegister()"><i class="fa fa-user-check"></i> Register</button>
    <p class="auth-link">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function doRegister() {
  const fields = ['name','email','address','mobile','username','password'];
  const form = document.createElement('form');
  form.method = 'POST';
  form.action = '{{ url_for("register") }}';
  fields.forEach(id => {
    const inp = document.createElement('input');
    inp.name  = id;
    inp.value = document.getElementById(id).value;
    form.appendChild(inp);
  });
  document.body.appendChild(form);
  form.submit();
}
</script>
{% endblock %}
